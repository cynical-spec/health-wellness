name: Deploy Sehat Saathi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Worker config (NO upstream API keys)
        # SECURITY: upstream API keys are NEVER injected into the published
        # HTML. The browser only gets the Worker URL + the shared CLIENT_TOKEN;
        # all real keys live server-side on the Cloudflare Worker. The old
        # direct-key substitution leaked keys into the consumer page source.
        env:
          # Non-secret presentation config (voice IDs, model name) only.
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_INDIC: ${{ secrets.ELEVENLABS_VOICE_ID_INDIC }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # Required: the Worker proxy URL + shared client token.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          worker_url      = os.environ.get("WORKER_URL","").strip()
          client_token    = os.environ.get("CLIENT_TOKEN","").strip()
          anthropic_model = os.environ.get("ANTHROPIC_MODEL","").strip() or "claude-sonnet-4-5"
          voice           = os.environ.get("ELEVENLABS_VOICE_ID","").strip()
          voice_indic     = os.environ.get("ELEVENLABS_VOICE_ID_INDIC","").strip()

          # Hard gate: we no longer ship keys, so the Worker is mandatory.
          if not worker_url or not client_token:
              sys.exit("FATAL: WORKER_URL and CLIENT_TOKEN secrets are required "
                       "(API keys are no longer injected). Set them in repo Secrets.")

          with open("index.html","r") as f:
              html = f.read()

          # Blank out every upstream-key placeholder — keys must NEVER reach HTML.
          for ph in ("REPLACE_WITH_YOUR_KEY","REPLACE_WITH_GROQ_KEY",
                     "REPLACE_WITH_SARVAM_KEY","REPLACE_WITH_ELEVENLABS_KEY",
                     "REPLACE_WITH_CEREBRAS_KEY","REPLACE_WITH_ANTHROPIC_KEY"):
              html = html.replace(ph, "")

          # Inject only non-secret config + the Worker plumbing.
          html = html.replace("REPLACE_WITH_ELEVENLABS_VOICE_ID", voice)
          html = html.replace("REPLACE_WITH_ELEVENLABS_VOICE_ID_INDIC", voice_indic)
          html = html.replace("REPLACE_WITH_ANTHROPIC_MODEL", anthropic_model)
          html = html.replace("REPLACE_WITH_WORKER_URL", worker_url)
          html = html.replace("REPLACE_WITH_CLIENT_TOKEN", client_token)

          # Defense-in-depth: abort the deploy if a real upstream-key prefix
          # somehow appears in the output (catches future regressions).
          leak = re.search(r"sk-ant-[A-Za-z0-9_\-]{6}|gsk_[A-Za-z0-9]{6}|csk-[A-Za-z0-9]{6}", html)
          if leak:
              sys.exit("FATAL: an API-key-like string was found in index.html "
                       "after injection — aborting deploy to avoid a key leak.")

          with open("index.html","w") as f:
              f.write(html)
          print("Injected Worker config only — NO upstream keys. "
                "Worker:", bool(worker_url), "ClientToken:", bool(client_token),
                "(model:", anthropic_model + ")")
          PYEOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
